<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Прямой диван Helix Brera 56</title>
    <link href="libs/slick/slick.css" type="text/css" rel="stylesheet" />
    <link href="libs/slick/slick-theme.css" type="text/css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header__left">
          <button class="header__btn" type="button" aria-label="Меню">
            <img src="assets/icon-burger.svg" alt="" width="24" height="24" />
          </button>
          <a class="header__logo" href="#" aria-label="askona">
            <img src="assets/logo.svg" alt="askona" width="92" height="19.574" />
          </a>
        </div>
        <div class="header__controls">
          <button class="header__btn" type="button" aria-label="Поиск">
            <img src="assets/icon-search.svg" alt="" width="24" height="24" />
          </button>
          <a class="header__btn" href="tel:+78000000000" aria-label="Позвонить">
            <img src="assets/icon-phone.svg" alt="" width="24" height="24" />
          </a>
          <a class="header__btn" href="#" aria-label="Корзина">
            <img src="assets/icon-cart.svg" alt="" width="24" height="24" />
          </a>
        </div>
      </header>

      <nav class="breadcrumbs" aria-label="Навигация">
        <div class="breadcrumbs__wrap tabs">
          <a class="breadcrumbs__item tab" href="#">Главная</a>
          <a class="breadcrumbs__item tab" href="#">Диваны</a>
          <a class="breadcrumbs__item tab" href="#">Мини-диваны</a>
          <span class="breadcrumbs__item breadcrumbs__item--current tab"> Helix Brera&nbsp;&nbsp;56 </span>
        </div>
      </nav>

      <main class="content">
        <section class="product">
          <div class="slider">
            <div class="slider__like" type="button" aria-label="В избранное">
              <img class="slider__likeImg" src="assets/icon-like.svg" alt="" width="24" height="24" />
            </div>

            <div class="slider__wrap">
              <div class="slider__slide">
                <img class="slider__photo" src="assets/slide-1.jpg" alt="Прямой диван Helix Brera 56" />
              </div>
              <div class="slider__slide">
                <img class="slider__photo" src="assets/slide-2.jpg" alt="Прямой диван Helix Brera 56" />
              </div>
              <div class="slider__slide">
                <img class="slider__photo" src="assets/slide-3.jpg" alt="Прямой диван Helix Brera 56" />
              </div>
            </div>

            <div class="slider__nav">
              <a class="slider__room" href="#">
                <span class="slider__eye">
                  <img src="assets/icon-eye.svg" alt="" width="17" height="11.009" />
                </span>
                В комнате
              </a>
              <div class="slider__pager">
                <div class="slider__progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
                  <div class="slider__progressFill sr-only""></div>
                </div>
              </div>
            </div>
          </div>

          <div class="info">
            <div class="info__title">
              <h1 class="info__name">Прямой диван Helix Brera 56</h1>
              <div class="info__rating">
                <div class="info__stars">
                  <img src="assets/icon-star.svg" alt="" width="15" height="14" />
                  <span>5</span>
                </div>
                <a class="info__reviews" href="#">20 отзывов</a>
              </div>
            </div>

            <div class="price">
              <div class="price__info">
                <div class="price__bonus">
                  <img src="assets/icon-bonus.svg" alt="" width="14" height="13" />
                  <span>+ 2250 бонусов</span>
                </div>
                <div class="price__row">
                  <span class="price__discount">-25%</span>
                  <p class="price__current">45&nbsp;000&nbsp;₽</p>
                  <p class="price__old">60&nbsp;000&nbsp;₽</p>
                </div>
              </div>
              <div class="price__timer">
                <img src="assets/icon-clock.svg" alt="" width="16" height="16" />
                <span>11 : 06 : 04</span>
                <span>до конца акции</span>
              </div>
            </div>
          </div>
        </section>

        <section class="buy">
          <div class="buy__buttons">
            <button class="buy__btn" type="button">Купить в 1 клик</button>
            <button class="buy__btn" type="button">
              <span class="buy__icon">
                <img src="assets/icon-installment.svg" alt="" width="18.5" height="19" />
              </span>
              11 000 ₽ × 4 платежа
            </button>
          </div>
        </section>

        <section class="options">
          <div class="options__colors">
            <div class="options__head">
              <div class="options__label">
                <span class="options__muted">Цвет ткани</span>
                <span class="options__value">Brera 56</span>
              </div>
              <a class="options__all" href="#">Все цвета +150</a>
            </div>
            <div class="options__swatches tabs">
              <div class="swatch swatch--active tab" type="button" aria-label="Brera 56" aria-pressed="true">
                <span class="swatch__mask">
                  <img class="swatch__img swatch__img--1" src="assets/color-active.png" alt="" />
                </span>
                <!-- <img class="swatch__check" src="assets/color-check.svg" alt="" width="16" height="11" /> -->
              </div>
              <div class="swatch tab" type="button" aria-label="Цвет 2">
                <span class="swatch__mask">
                  <img class="swatch__img swatch__img--2" src="assets/color-2.png" alt="" />
                </span>
              </div>
              <div class="swatch tab" type="button" aria-label="Цвет 3">
                <span class="swatch__mask">
                  <img class="swatch__img swatch__img--3" src="assets/color-3.png" alt="" />
                </span>
              </div>
              <div class="swatch tab" type="button" aria-label="Цвет 4">
                <span class="swatch__mask">
                  <img class="swatch__img swatch__img--4" src="assets/color-4.png" alt="" />
                </span>
              </div>
              <div class="swatch tab" type="button" aria-label="Цвет 5">
                <span class="swatch__mask">
                  <img class="swatch__img swatch__img--5" src="assets/color-5.png" alt="" />
                </span>
              </div>
              <div class="swatch tab" type="button" aria-label="Цвет 6">
                <span class="swatch__mask">
                  <img class="swatch__img swatch__img--6" src="assets/color-6.png" alt="" />
                </span>
              </div>
              <div class="swatch tab" type="button" aria-label="Цвет 7">
                <span class="swatch__mask">
                  <img class="swatch__img swatch__img--7" src="assets/color-7.png" alt="" />
                </span>
              </div>
              <div class="swatch tab swatch--more" type="button">+150</div>
            </div>
            <a class="options__sample" href="#">
              <img src="assets/icon-material.svg" alt="" width="20" height="20" />
              Заказать образец ткани
            </a>
          </div>

          <div class="options__sizes">
            <p class="options__muted">Размер</p>
            <div class="options__size-list">
              <button class="size size--active" type="button" aria-pressed="true">163x103x90</button>
              <button class="size" type="button" aria-pressed="false">198х95х87</button>
            </div>
          </div>
        </section>

        <div class="cart">
          <button class="cart__btn" type="button">В корзину 45 000 ₽</button>
        </div>
      </main>
    </div>

    <script src="libs/jquery.min.js"></script>
    <script src="libs/slick/slick.min.js"></script>
    <script src="common.js"></script>
  </body>
</html>
